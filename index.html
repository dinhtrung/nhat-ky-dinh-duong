<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinh Dưỡng">
<meta name="description" content="Ghi bữa ăn hằng ngày, theo dõi kcal và macro so với mục tiêu — chạy offline, dữ liệu trên máy bạn.">
<title>Nhật Ký Dinh Dưỡng</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <header class="app-header">
    <div class="brand">
      <h1>Nhật Ký Dinh Dưỡng</h1>
      <div class="brand-sub" id="headerSub">—</div>
    </div>
    <span class="ver-chip" id="verChip" title="Phiên bản ứng dụng">—</span>
  </header>

  <main id="view" class="view"></main>
</div>

<!-- Thanh tab: 2 tab hoạt động. Change sau (Thống kê · Kế hoạch) sẽ đặt vào 2 ô trống
     bên trái/phải — đổi grid thành repeat(4, 1fr) là đủ, không cần đổi cấu trúc DOM. -->
<nav class="tabbar" id="tabbar" aria-label="Điều hướng chính">
  <div class="tabbar-inner">
    <button class="tab is-active" data-tab="today" type="button" onclick="switchTab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M9.5 19.5v-5h5v5"/></svg>
      <span>Hôm nay</span>
    </button>
    <button class="tab" data-tab="settings" type="button" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.9 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10.8 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 20.1 11a2 2 0 1 1 0 4Z" transform="translate(0 0) scale(0.98)"/></svg>
      <span>Cài đặt</span>
    </button>
  </div>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
